<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Geins</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0b0e14; color: #7fdbca;
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .box { text-align: center; }
    .brand { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
    .dim { color: #7e8aa3; margin-top: 8px; }
    .dot { animation: blink 1s steps(2, start) infinite; }
    @keyframes blink { to { visibility: hidden; } }
  </style>
</head>
<body>
  <div class="box">
    <div class="brand">geins</div>
    <div class="dim">starting local server<span class="dot">…</span></div>
  </div>
</body>
</html>
